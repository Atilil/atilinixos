name: build

# PR checks only: main is built and published by deploy.yml.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  #INFO: Eval + build checks only (not the systems). No --no-build: it forbids IFD, and the claude-code HM module reads fetched plugin dirs at eval time
  check:
    runs-on: nixos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: nix flake check --print-build-logs
      # TODO: fail if flake.nix is stale vs the modules (`nix run .#write-flake` then `git diff --exit-code flake.nix`)

  build:
    needs: check
    runs-on: nixos
    strategy:
      fail-fast: false
      matrix:
        #INFO: Keep in sync with the hosts in `fleet` (modules/nix/den/den.nix). HM is built inside each toplevel
        include:
          - target: laptop
            attr: nixosConfigurations.laptop.config.system.build.toplevel
          - target: ideapad
            attr: nixosConfigurations.ideapad.config.system.build.toplevel
    env:
      GCROOT_DIR: /home/runner/gcroots/ci
      KEEP: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Plan (built vs substituted)
        run: nix build --dry-run '.#${{ matrix.attr }}'

      #INFO: Harmonia serves mouse's store as is: a gcroot is what keeps a build in the cache.
      #      PR builds get none, so the next GC drops them.
      - name: Build
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            nix build --print-build-logs --no-link '.#${{ matrix.attr }}'
          else
            mkdir -p "$GCROOT_DIR"
            nix build --print-build-logs \
              --out-link "$GCROOT_DIR/${{ matrix.target }}-${{ github.run_id }}" '.#${{ matrix.attr }}'
            nix path-info -Sh "$GCROOT_DIR/${{ matrix.target }}-${{ github.run_id }}"
          fi

      - name: Keep the last builds only
        if: github.event_name != 'pull_request'
        run: ls -1t "$GCROOT_DIR/${{ matrix.target }}-"* | tail -n +$((KEEP + 1)) | xargs -r rm -f
