name: build

# PR checks only: main is built and published by deploy.yml.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  #INFO: Eval + build checks only (not the systems). No --no-build: it forbids IFD, and the claude-code HM module reads fetched plugin dirs at eval time
  check:
    runs-on: nixos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: nix flake check --print-build-logs
      # TODO: fail if flake.nix is stale vs the modules (`nix run .#write-flake` then `git diff --exit-code flake.nix`)

  #INFO: Keep HOSTS in sync with `fleet` (modules/nix/den/den.nix)
  build:
    needs: check
    runs-on: nixos
    env:
      HOSTS: laptop ideapad
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build what no cache provides
        run: |
          set -euo pipefail
          plan=$(mktemp)
          for host in $HOSTS; do
            echo "::group::$host"
            attr=".#nixosConfigurations.$host.config.system.build.toplevel"

            nix build --dry-run "$attr" 2>&1 | tee "$plan"

            mapfile -t drvs < <(awk '/will be built:$/ {b=1; next} /^[^ ]/ {b=0} b && /\.drv$/ {print $1}' "$plan")
            todo=()
            for drv in "${drvs[@]}"; do
              # Skip assembly derivations (toplevel, system-path...): building them pulls the whole closure
              [ "$(nix-store --query --binding preferLocalBuild "$drv" 2>/dev/null || true)" = 1 ] || todo+=("$drv^*")
            done

            echo "$host: ${#drvs[@]} derivations not in any cache, ${#todo[@]} to build"
            if [ "${#todo[@]}" -gt 0 ]; then
              nix build --no-link --print-build-logs "${todo[@]}"
            fi
            echo "::endgroup::"
          done
