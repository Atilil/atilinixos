name: build

# PR checks only: main is built and published by deploy.yml.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: nixos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: nix develop -c pre-commit run --all-files --show-diff-on-failure

  #INFO: Eval + build checks only (not the systems). No --no-build: it forbids IFD, and the claude-code HM module reads fetched plugin dirs at eval time
  check:
    runs-on: nixos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Also fails on a stale flake.nix (flake-file's check-flake-file)
      - run: nix flake check --print-build-logs

  #INFO: Keep HOSTS in sync with `fleet` (modules/nix/den/den.nix)
  build:
    needs: check
    runs-on: nixos
    env:
      HOSTS: laptop ideapad
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build hosts
        run: |
          for host in $HOSTS; do
            echo "::group::$host"
            nix build --print-build-logs --no-link \
              ".#nixosConfigurations.$host.config.system.build.toplevel"
            echo "::endgroup::"
          done
