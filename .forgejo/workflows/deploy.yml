name: deploy

# Builds main on mouse, then publishes it as `deploy` for the hosts' autoUpgrade.
# Input updates come from Renovate PRs, already checked by build.yml before they reach main.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ forgejo.workflow }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: nixos
    env:
      HOSTS: laptop ideapad
      GCROOT_DIR: /home/runner/gcroots/deploy
      KEEP: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main

      # A gcroot keeps each build alive in mouse's store, which Harmonia serves to the hosts.
      - name: Build hosts
        run: |
          mkdir -p "$GCROOT_DIR"
          for host in $HOSTS; do
            nix build --print-build-logs \
              --out-link "$GCROOT_DIR/$host-${{ forgejo.run_id }}" \
              ".#nixosConfigurations.$host.config.system.build.toplevel"
          done

      # Reached only when every host built, so `deploy` never points to an unbuilt commit.
      - name: Publish deploy
        env:
          TOKEN: ${{ secrets.CI_PUSH_TOKEN }}
        run: |
          remote="$(echo '${{ forgejo.server_url }}' | sed "s#://#://${{ forgejo.repository_owner }}:$TOKEN@#")/${{ forgejo.repository }}.git"
          git push -q --force "$remote" HEAD:refs/heads/deploy

      - name: Keep the last builds only
        run: |
          for host in $HOSTS; do
            ls -1t "$GCROOT_DIR/$host-"* | tail -n +$((KEEP + 1)) | xargs -r rm -f
          done
