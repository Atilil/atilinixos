name: deploy

# Builds on mouse only what no public cache provides; hosts fetch the rest from cache.nixos.org.
# Input updates come from Renovate PRs, already checked by build.yml before they reach main.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ forgejo.workflow }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: nixos
    env:
      HOSTS: laptop ideapad
      GCROOT_DIR: /home/runner/gcroots/deploy
      KEEP: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      # A gcroot keeps each build in mouse's store, which Harmonia serves to the hosts.
      - name: Build what no cache provides
        run: |
          mkdir -p "$GCROOT_DIR"
          for host in $HOSTS; do
            echo "::group::$host"
            .forgejo/scripts/build-uncached.sh "$host" "$GCROOT_DIR"
            echo "::endgroup::"
          done
        env:
          GITHUB_RUN_ID: ${{ forgejo.run_id }}

      - name: Keep the last builds only
        run: |
          for host in $HOSTS; do
            ls -1dt "$GCROOT_DIR/$host-"* 2>/dev/null | tail -n +$((KEEP + 1)) | xargs -r rm -rf
          done
