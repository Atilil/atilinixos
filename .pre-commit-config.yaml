# Checks run before each commit (via the global git hook) and in CI.

default_stages: [pre-commit]

repos:
  # Generic checks: syntax, file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks-system
        pass_filenames: false

  # Commit messages: Conventional Commits
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8 # frozen: v4.4.0
    hooks:
      - id: conventional-pre-commit
        args:
          [
            --verbose,
            feat,
            fix,
            refactor,
            docs,
            ci,
            build,
            chore,
            test,
            perf,
            revert,
          ]

  - repo: local
    hooks:
      - id: forgejo-runner-validate
        name: Validate Forgejo Actions files
        entry: forgejo-runner validate --directory .
        language: system
        pass_filenames: false
        files: (?:(?:^|/)action|^\.(?:forgejo|github|gitea)/workflows/[^/\n]+)\.ya?ml$
        types: [yaml]

      # A decrypted secrets file has no sops: metadata block
      - id: sops-encrypted
        name: SOPS secrets are encrypted
        entry: "^sops:"
        language: pygrep
        args: [--negate]
        files: (^|/)sops/[^/]+\.ya?ml$

      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
        # direnv DSL, not a standalone script
        exclude: ^\.envrc$

      # flake.nix is generated by flake-file; _hardware.nix by nixos-generate-config
      - id: alejandra
        name: alejandra
        entry: alejandra --check
        language: system
        types: [nix]
        exclude: ^flake\.nix$

      - id: deadnix
        name: deadnix
        entry: deadnix --fail
        language: system
        types: [nix]
        exclude: ^flake\.nix$|(^|/)_hardware\.nix$

      # statix takes one target, not a file list: scan the tree, ignore generated files
      - id: statix
        name: statix
        entry: statix check . -i flake.nix -i '**/_hardware.nix' -i .direnv
        language: system
        pass_filenames: false
        types: [nix]
