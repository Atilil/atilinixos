"$schema" = 'https://starship.rs/config-schema.json'

# One line; username/hostname only show over SSH or as root (starship defaults)
format = '$username$hostname$directory$git_branch$git_status$nix_shell$cmd_duration$character'
add_newline = false

# ANSI names so the prompt tracks the live Noctalia terminal palette
palette = 'noctalia'

[palettes.noctalia]
accent = 'blue'
git    = 'green'
nix    = 'yellow'
muted  = 'bright-black'

[directory]
style             = 'bold accent'
truncation_length = 3
truncation_symbol = '…/'
read_only         = ' '

[git_branch]
format = '[ $branch]($style) '
style  = 'git'

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style  = 'git'

[nix_shell]
format = '[ nix]($style) '
style  = 'nix'

[cmd_duration]
format             = '[$duration]($style) '
style              = 'muted'
show_notifications = true
min_time_to_notify = 600000

[character]
success_symbol            = '[❯](bold muted)'
error_symbol              = '[❯](bold red)'
vimcmd_symbol             = '[❮](bold accent)'
vimcmd_replace_one_symbol = '[❮](bold nix)'
vimcmd_replace_symbol     = '[❮](bold nix)'
vimcmd_visual_symbol      = '[❮](bold nix)'
